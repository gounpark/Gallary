name: Keep Supabase Alive

# Supabase 무료 플랜은 7일간 활동이 없으면 프로젝트를 일시정지한다.
# 6일 간격 조회(SELECT)만으로는 정지를 막지 못했기 때문에(2026-06, 07 두 번 정지)
# 매일 실행하고, Gallery는 실제 쓰기(UPSERT)까지 한다.
# 실패하면 run이 빨간불(Failure)이 되고 GitHub 알림 메일이 오도록 curl --fail을 쓴다.

on:
  schedule:
    - cron: '17 0 * * *'   # 매일 00:17 UTC = 한국 09:17
  workflow_dispatch:        # 수동 실행 가능
  push:                     # 이 파일을 고쳐 올리면 바로 한 번 실행(검증용)
    branches: [main]
    paths: ['.github/workflows/keep-supabase-alive.yml']

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-latest
    env:
      URL: ${{ secrets.VITE_SUPABASE_URL }}
      KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Check secrets
        run: |
          [ -n "$URL" ] || { echo "::error::VITE_SUPABASE_URL secret is empty"; exit 1; }
          [ -n "$KEY" ] || { echo "::error::VITE_SUPABASE_ANON_KEY secret is empty"; exit 1; }

      - name: Read (SELECT apps)
        run: |
          curl -sS --fail-with-body -o /dev/null -w "Gallery read: %{http_code}\n" \
            "$URL/rest/v1/apps?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"

      - name: Write (UPSERT heartbeat row)
        # share_links 테이블에 id='__keepalive__' 행 하나만 계속 덮어쓴다.
        # target_id가 실제 앱/플로우 id가 아니라서 앱 화면에는 나타나지 않는다.
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sS --fail-with-body -o /dev/null -w "Gallery write: %{http_code}\n" \
            -X POST "$URL/rest/v1/share_links?on_conflict=id" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "{\"id\":\"__keepalive__\",\"type\":\"keepalive\",\"target_id\":\"__keepalive__\",\"label\":\"keep-supabase-alive workflow\",\"created_at\":\"$NOW\"}"

  andamiro:
    # Gallery가 실패해도 따로 실행되도록 별도 job으로 분리
    runs-on: ubuntu-latest
    env:
      URL: ${{ secrets.ANDAMIRO_SUPABASE_URL }}
      KEY: ${{ secrets.ANDAMIRO_SUPABASE_ANON_KEY }}
    steps:
      - name: Check secrets
        run: |
          [ -n "$URL" ] || { echo "::error::ANDAMIRO_SUPABASE_URL secret is empty"; exit 1; }
          [ -n "$KEY" ] || { echo "::error::ANDAMIRO_SUPABASE_ANON_KEY secret is empty"; exit 1; }

      - name: Read (SELECT emotions)
        run: |
          curl -sS --fail-with-body -o /dev/null -w "Andamiro read: %{http_code}\n" \
            "$URL/rest/v1/emotions?limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"

  keep-repo-active:
    # 저장소에 60일간 커밋이 없으면 GitHub가 스케줄 실행을 자동으로 끈다(2026-09-01에 꺼졌음).
    # 마지막 커밋이 45일 넘게 지났으면 빈 커밋을 하나 남겨 스케줄이 꺼지지 않게 한다.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit if repo idle for 45+ days
        run: |
          last=$(git log -1 --format=%ct)
          idle=$(( ($(date +%s) - last) / 86400 ))
          echo "Days since last commit: $idle"
          if [ "$idle" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflow active"
            git push
          fi
