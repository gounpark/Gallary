name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 9 */6 * *'  # 6일마다 오전 9시
  workflow_dispatch:        # 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Gallery Supabase
        run: |
          curl -s -o /dev/null -w "Gallery: %{http_code}\n" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/apps?limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}"

      - name: Ping Andamiro Supabase
        run: |
          curl -s -o /dev/null -w "Andamiro: %{http_code}\n" \
            "${{ secrets.ANDAMIRO_SUPABASE_URL }}/rest/v1/emotions?limit=1" \
            -H "apikey: ${{ secrets.ANDAMIRO_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.ANDAMIRO_SUPABASE_ANON_KEY }}"
